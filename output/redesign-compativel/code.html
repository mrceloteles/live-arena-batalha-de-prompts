<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        extend: {

<style>
    /* Custom Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(241, 245, 249, 0.6); }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: #64748b; }

    /* Fundo Gradiente Suave Original do Portal Inicial (index.php) */
    .portal-bg {
      background-color: #dbeafe;
      background-image: 
        radial-gradient(circle at 10% 20%, #a7f3d0 0%, transparent 42%),
        radial-gradient(circle at 90% 15%, #bae6fd 0%, transparent 45%),
        radial-gradient(circle at 50% 50%, #93c5fd 0%, transparent 55%),
        radial-gradient(circle at 88% 85%, #ddd6fe 0%, transparent 48%),
        radial-gradient(circle at 12% 88%, #bae6fd 0%, transparent 45%);
      background-attachment: fixed;
    }

    /* Padrão Ícone Real dos Fluxos de Ringue/Jogo/TV: LISTRAS DIAGONAIS AZUIS VIBRANTES EM 45 GRAUS (game.php & main.php) */
    .arena-stripes-bg {
      background-color: #005ce6;
      background-image: repeating-linear-gradient(
        -45deg,
        #005ce6,
        #005ce6 32px,
        #0076ff 32px,
        #0076ff 64px
      );
      background-attachment: fixed;
    }

    /* Padrão Fita de Perigo Esportiva / Hazard Tape amarela e preta */
    .hazard-stripe-bar {
      height: 18px;
      width: 100%;
      background: repeating-linear-gradient(
        -45deg,
        #ffd000,
        #ffd000 14px,
        #1c1917 14px,
        #1c1917 28px
      );
    }

    .hazard-stripe-bar-sm {
      height: 10px;
      width: 100%;
      background: repeating-linear-gradient(
        -45deg,
        #ffd000,
        #ffd000 10px,
        #1c1917 10px,
        #1c1917 20px
      );
    }

    /* Fita de perigo sutil para badges ou divisores */
    .hazard-badge {
      background: repeating-linear-gradient(
        -45deg,
        #ffd000,
        #ffd000 8px,
        #292524 8px,
        #292524 16px
      );
    }

    /* Texto Gradiente Descubra o PROMPT */
    .prompt-brand-cyan {
      background: linear-gradient(110deg, #00b4d8 0%, #0077b6 50%, #0052cc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Traço Decorativo Rosa/Magenta Estilizado do PROMPT */
    .magenta-swoosh {
      height: 6px;
      background: linear-gradient(90deg, #ff2d75 0%, #ff5e97 80%, #ffa3c2 100%);
      border-radius: 9999px;
      position: relative;
    }
    .magenta-swoosh::after {
      content: '';
      position: absolute;
      right: -2px;
      top: -2px;
      width: 10px;
      height: 10px;
      background: #ff2d75;
      transform: rotate(45deg);
      border-radius: 2px;
    }

    .glass-nav-bar {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(226, 232, 240, 0.9);
    }

    .card-pure-white {
      background: #ffffff;
      border-radius: 28px;
    }
  </style>
</head>

<!-- Seletor de Estados Rápidos de Demonstração -->
<div class="h-4 w-px bg-slate-300 mx-1 hidden sm:block"></div>

<select class="bg-white border border-purple-300 text-xs font-mono font-medium text-purple-900 rounded-xl px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-purple-400 cursor-pointer shadow-xs" id="stateSimulator">

<button class="px-2.5 py-1 text-xs rounded-lg font-semibold text-slate-600 hover:text-slate-900 transition-all" id="btnViewMobile" title="Simular Smartphone Aluno (390px)">390px</button>
<button class="px-2.5 py-1 text-xs rounded-lg font-semibold text-slate-600 hover:text-slate-900 transition-all" id="btnViewTV" title="Simular Projeção 16:9 Palco">16:9 TV</button>
</div>
</div>
</div>

<script>
    const mockData = {
      session: {
        role: 'student',
        studentId: 'p-8821',
        studentName: 'Lucas Ferreira',
        company: 'Agência Digital',
        roleTitle: 'Designer de Prompts',
        email: 'lucas.ferreira@livearena.com.br',
        roomCode: '7482',
        roomId: 'room-alpha-9',
        roomTitle: 'Turma de IA Aplicada — 1º Semestre',
        preset: 'arena',
        status: 'playing',
        pcNumber: 'PC 1'
      },
      currentMission: {

        total: 3,
        title: 'Engenharia Reversa: Peça Publicitária Futurista',
        modality: 'reversa',
        category: 'Imagem & Comunicação',
        timeRemaining: '02:30',
        attemptsAllowed: 3,
        attemptsUsed: 1,
        missionContext: 'Uma peça publicitária sofisticada de um festival de música, com tipografia grande, paleta neon sobre fundo escuro e destaque para a data SONIC 2026.',
        expectedResult: 'Prompt estruturado que recrie a atmosfera cyberpunk, iluminação volumétrica e hierarquia de texto.',
        referenceImageUrl: 'https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?auto=format&fit=crop&w=1000&q=80',
        lastSubmission: {
          prompt: 'Cartaz minimalista para festival eletrônico, fundo preto com neon ciano e roxo. Texto principal "SONIC 2026" em tipografia bold caixa alta. Iluminação de laser e partículas no ar.',
          score: 88,
          feedback: 'Excelente captura da atmosfera neon e paleta de cores. Para pontuação máxima, especifique o enquadramento (visão frontal ou isométrica) e parâmetros de iluminação volumétrica.',
          criteria: [
            { name: 'Paleta & Atmosfera Neon', score: 95, note: 'Tons de ciano e roxo fiéis ao estilo do festival.' },
            { name: 'Tipografia & Hierarquia', score: 88, note: 'SONIC 2026 em destaque e legível.' },
            { name: 'Composição Técnica', score: 81, note: 'Faltou parâmetro de profundidade de campo e proporção de lente.' }
          ]
        }
      },
      teacherRooms: [
        { id: 'r-1', code: '7482', title: 'Turma de IA Aplicada — 1º Semestre', preset: 'Arena Coletiva (Boss)', status: 'playing', students: 28, capacity: 50, round: 1, totalRounds: 3 },
        { id: 'r-2', code: '3190', title: 'Oficina Rápida: Engenharia de Prompts', preset: 'Batalha de Turma', status: 'waiting', students: 14, capacity: 35, round: 1, totalRounds: 3 },
        { id: 'r-3', code: '8820', title: 'Design Sprint com LLMs', preset: 'Clássico (3 Jogadores)', status: 'draft', students: 0, capacity: 25, round: 0, totalRounds: 5 }
      ],
      challengesBank: [
        { id: 'ch-1', title: 'Reversa: Peça Publicitária Futurista', modality: 'reversa', category: 'Imagem', duration: 150, attempts: 3, hasImage: true },
        { id: 'ch-2', title: 'Briefing: O Cliente Indeciso da Startup', modality: 'briefing', category: 'Texto & Negócios', duration: 180, attempts: 2, hasImage: false },
        { id: 'ch-3', title: 'Prompt Essencial: Machine Learning em 3 Frases', modality: 'essencial', category: 'Conceito', duration: 120, attempts: 2, hasImage: false },
        { id: 'ch-4', title: 'Boss Battle: Guardião dos Algoritmos', modality: 'boss', category: 'Avançado', duration: 240, attempts: 3, hasImage: true }
      ],
      leaderboard: [
        { rank: '1º', name: 'Mariana Duarte', pc: 'PC 2', score: 285, time: '01:14', company: 'Faculdade Tech' },
        { rank: '2º', name: 'Lucas Ferreira (Você)', pc: 'PC 1', score: 268, time: '01:28', company: 'Agência Digital' },
        { rank: '3º', name: 'Carlos Eduardo', pc: 'PC 3', score: 242, time: '01:45', company: 'Design Lab' }
      ]
    };

    // =========================================================================
    // CONTROLADOR DA APLICAÇÃO (TELAS LA-01 A LA-13)
    // =========================================================================
    const app = {
      currentScreen: 'LA-01',
      currentState: 'normal',
      viewportMode: 'auto',

      init() {
        this.bindEvents();
        this.renderScreen(this.currentScreen);
      },

      bindEvents() {
        const selector = document.getElementById('screenSelector');
        selector.addEventListener('change', (e) => {
          this.currentScreen = e.target.value;
          this.renderScreen(this.currentScreen);
        });

        const stateSim = document.getElementById('stateSimulator');
        stateSim.addEventListener('change', (e) => {
          this.currentState = e.target.value;
          this.showToast(`Estado alterado: ${e.target.options[e.target.selectedIndex].text}`, '⚡');
          this.renderScreen(this.currentScreen);
        });

        document.getElementById('btnViewResponsive').addEventListener('click', () => this.setViewport('auto'));
        document.getElementById('btnViewMobile').addEventListener('click', () => this.setViewport('mobile'));
        document.getElementById('btnViewTV').addEventListener('click', () => this.setViewport('tv'));
      },

      updateThemeBackground(screenId) {
        const body = document.getElementById('mainBody');
        // As telas de Ringue do Aluno (LA-03B/C/D/E) e TV Palco (LA-09/LA-11) exibem o fundo oficial com listras diagonais esportivas azuis
        const isArenaStriped = ['LA-03-mission', 'LA-03-evaluating', 'LA-03-result', 'LA-03-collective', 'LA-09', 'LA-11'].includes(screenId);
        
        if (isArenaStriped) {
          body.classList.remove('portal-bg');
          body.classList.add('arena-stripes-bg');
        } else {
          body.classList.remove('arena-stripes-bg');
          body.classList.add('portal-bg');
        }
      },

      setViewport(mode) {
        this.viewportMode = mode;
        const container = document.getElementById('screenContainer');
        const btns = [
          document.getElementById('btnViewResponsive'),
          document.getElementById('btnViewMobile'),
          document.getElementById('btnViewTV')
        ];

        btns.forEach(b => {
          b.className = 'px-2.5 py-1 text-xs rounded-lg font-semibold text-slate-600 hover:text-slate-900 transition-all';
        });

        if (mode === 'mobile') {
          container.className = 'w-full max-w-[400px] mx-auto border-8 border-slate-900 rounded-[44px] overflow-hidden shadow-2xl p-2 bg-slate-100 transition-all';
          btns[1].className = 'px-2.5 py-1 text-xs rounded-lg font-bold bg-blue-100 text-blue-900 border border-blue-300 shadow-xs';
        } else if (mode === 'tv') {
          container.className = 'w-full max-w-[1340px] aspect-video mx-auto border-8 border-slate-900 rounded-3xl overflow-hidden shadow-2xl p-4 bg-slate-950 transition-all';
          btns[2].className = 'px-2.5 py-1 text-xs rounded-lg font-bold bg-indigo-100 text-indigo-900 border border-indigo-300 shadow-xs';
        } else {
          container.className = 'w-full max-w-6xl mx-auto transition-all';
          btns[0].className = 'px-2.5 py-1 text-xs rounded-lg font-bold bg-blue-100 text-blue-900 border border-blue-300 shadow-xs';
        }
      },

      showToast(message, icon = '✨') {
        const toast = document.getElementById('toastNotification');
        document.getElementById('toastText').innerText = message;
        document.getElementById('toastIcon').innerText = icon;
        toast.classList.remove('translate-y-20', 'opacity-0');
        toast.classList.add('translate-y-0', 'opacity-100');
        setTimeout(() => {
          toast.classList.add('translate-y-20', 'opacity-0');
          toast.classList.remove('translate-y-0', 'opacity-100');
        }, 3200);
      },

      openModal(htmlContent) {
        const modal = document.getElementById('globalModal');
        const content = document.getElementById('modalContent');
        content.innerHTML = `
          <button onclick="app.closeModal()" class="absolute top-5 right-5 text-slate-400 hover:text-slate-700 p-1.5 rounded-full bg-slate-100 hover:bg-slate-200 transition-colors">
            ✕
          </button>
          ${htmlContent}
        `;
        modal.classList.remove('hidden');
      },

      closeModal() {
        document.getElementById('globalModal').classList.add('hidden');
      },

      renderScreen(screenId) {
        this.currentScreen = screenId;
        this.updateThemeBackground(screenId);

        const container = document.getElementById('screenContainer');
        const selector = document.getElementById('screenSelector');
        if (selector.value !== screenId) {
          selector.value = screenId;
        }

        switch(screenId) {
          case 'LA-01': container.innerHTML = this.viewPortal(); break;
          case 'LA-02': container.innerHTML = this.viewStudentJoin(); break;
          case 'LA-03-lobby': container.innerHTML = this.viewStudentLobby(); break;
          case 'LA-03-mission': container.innerHTML = this.viewStudentMission(); break;
          case 'LA-03-evaluating': container.innerHTML = this.viewStudentEvaluating(); break;
          case 'LA-03-result': container.innerHTML = this.viewStudentResult(); break;
          case 'LA-03-collective': container.innerHTML = this.viewStudentCollective(); break;
          case 'LA-04': container.innerHTML = this.viewAdminLogin(); break;
          case 'LA-05': container.innerHTML = this.viewTeacherDashboard(); break;
          case 'LA-06': container.innerHTML = this.viewRoomDetail(); break;
          case 'LA-07': container.innerHTML = this.viewChallengesBank(); break;
          case 'LA-08': container.innerHTML = this.viewLessonsTracks(); break;
          case 'LA-09': container.innerHTML = this.viewTVStage(); break;
          case 'LA-10': container.innerHTML = this.viewStudentPreview(); break;
          case 'LA-11': container.innerHTML = this.viewTVPreview(); break;
          case 'LA-12': container.innerHTML = this.viewAnalyticsReport(); break;
          case 'LA-13': container.innerHTML = this.viewNotFound(); break;
          default: container.innerHTML = this.viewPortal();
        }
      },

      // =========================================================================
      // LA-01: PORTAL INICIAL (EXATA COMPOSIÇÃO DE index.php)
      // =========================================================================
      viewPortal() {
        return `<main data-page="index" data-screen-id="LA-01" class="min-h-[75vh] flex items-center justify-center px-4 py-8"><section class="w-full max-w-xl bg-white rounded-[32px] overflow-hidden shadow-floating-card text-center"><div class="hazard-stripe-bar"></div><div class="p-8 sm:p-12"><div class="inline-flex rounded-full border border-blue-100 px-6 py-3 text-blue-700 font-black tracking-wider">LIVE ARENA · BATALHA DE PROMPTS</div><h1 class="mt-8 text-4xl sm:text-5xl font-black text-slate-900">Descubra o <span class="text-blue-600">PROMPT</span></h1><div class="magenta-swoosh w-40 mx-auto mt-3 mb-8"></div><a href="/play" data-route="/play" onclick="event.preventDefault(); app.renderScreen('LA-02')" class="inline-block w-full py-5 rounded-full bg-blue-600 hover:bg-blue-700 text-white font-black shadow-pill-glow">Entrar na Arena</a></div></section></main>`;
      },
      viewStudentJoin() {
        const isClosed = this.currentState === 'room_blocked';
        const isOffline = this.currentState === 'offline';

        return `
          <div data-page="arena" data-screen-id="LA-02" data-arena-screen="join" class="min-h-[75vh] flex items-center justify-center px-4 py-8">
            <div class="w-full max-w-md bg-white rounded-[32px] overflow-hidden shadow-floating-card border border-slate-100 relative">
              
              <!-- Fita de Perigo Esportiva no Topo do Card -->
              <div class="hazard-stripe-bar"></div>

              <div class="p-7 sm:p-8">
                <div class="text-center mb-6">
                  <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-blue-50 border border-blue-200 text-blue-700 text-[11px] font-black uppercase tracking-wider mb-2">
                    <span>🥊</span> LIVE ARENA
                  </div>
                  <h2 class="text-2xl sm:text-3xl font-sans font-black text-slate-900">Batalha de Prompts</h2>
                  <div class="magenta-swoosh w-28 mx-auto mt-1 mb-2"></div>
                  <p class="text-xs text-slate-500">O código vem do professor.</p>
                </div>

                ${isClosed ? `
                  <div class="mb-5 p-3.5 rounded-2xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-medium flex items-center gap-2">
                    <span class="text-base">🚫</span>
                    <span><strong>Entrada Fechada:</strong> O professor bloqueou novas entradas para esta rodada.</span>
                  </div>
                ` : ''}

                ${isOffline ? `

    // Ajustes do protótipo: navegação de demonstração não vira controle do aluno.
    const compatibilityRoutes = {'LA-01':'/','LA-02':'/play','LA-04':'/admin-arena.php','LA-05':'/admin-arena.php','LA-06':'/admin-arena.php','LA-07':'/admin-arena.php','LA-08':'/admin-arena.php','LA-09':'/tv.php','LA-10':'/aluno-preview.php?room=ID','LA-11':'/tv-preview.php?room=ID','LA-12':'/report.php'};
    const originalRender = app.renderScreen;
    app.renderScreen = function(id) {
      originalRender.call(this,id);
      const root=document.getElementById('screenContainer');
      root.dataset.screenId=id;root.dataset.route=compatibilityRoutes[id] || (id.startsWith('LA-03')?'/play':'404');
      root.querySelectorAll('button').forEach(btn=>{
        const action=btn.getAttribute('onclick')||'';
        const restricted=(id==='LA-03-lobby'&&action.includes("renderScreen('LA-03-mission')")) ||
          (id==='LA-03-evaluating'&&action.includes("renderScreen('LA-03-result')")) ||
          (id==='LA-03-result'&&action.includes("renderScreen('LA-03-collective')")) ||
          (id==='LA-03-collective'&&action.includes('renderScreen')) ||
          (id==='LA-09'&&action.includes("renderScreen('LA-06')"));
        if(restricted)btn.remove();
      });
      if(id==='LA-03-evaluating') {
        const p=document.createElement('p');p.className='text-center text-sm font-bold text-blue-800 p-4';p.textContent='Resposta recebida. A nota aparecerá automaticamente quando a avaliação terminar.';root.append(p);
      }
    };

    window.addEventListener('DOMContentLoaded', () => {
      app.init();
    });
  </script>
