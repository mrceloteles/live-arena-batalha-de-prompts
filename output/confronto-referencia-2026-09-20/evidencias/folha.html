<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Sala em destaque × referência clara</title>
<style>body{font:14px/1.5 system-ui,sans-serif;background:#f5f7fc;color:#1f2937;margin:0;padding:32px}h1{font-size:20px}figure{margin:0 0 28px;background:#fff;border:1px solid #e2e8f3;border-radius:16px;padding:16px}img{max-width:100%;display:block;border-radius:10px;border:1px solid #eef2f8}figcaption{margin-top:8px;font-size:12px;color:#545b61}</style></head>
<body><h1>A sala em destaque depois do confronto com a referência clara — 20/09/2026</h1>
<p>Mesmo servidor, mesmo banco, quatro estados. Em todas: a faixa de números abre o corpo da sala e a bancada de comandos vem depois dela — a ordem da referência.</p>
<figure><img src="01-encerrada.png" alt="aula em jogo encerrada"><figcaption>01 — <b>Sala encerrada</b>: o selo do código voltou (com o estado "Fechado" ao lado), com QR, copiar link e abrir telão — e <b>sem</b> a porta de trancar. Os cartões mostram a última missão: "Missão 1 de 1 · encerrada", "3 de 3 entregues · 100% concluído · última missão", "0% 3 avaliados".</figcaption></figure>
<figure><img src="02-lobby.png" alt="aula em lobby"><figcaption>02 — <b>Lobby</b>: "Pronta para começar" no selo, "Iniciar missão" como próxima ação e o botão grande logo abaixo do anúncio da missão.</figcaption></figure>
<figure><img src="03-rascunho.png" alt="sala em rascunho"><figcaption>03 — <b>Rascunho</b>: sem selo de código, que é o certo — o PIN nasce com a abertura da sala.</figcaption></figure>
<figure><img src="04-em-jogo.png" alt="aula em jogo"><figcaption>04 — <b>Em jogo</b>: rodada no ar, envios 3 de 3, selo do juiz e a fila de desafios na coluna da direita.</figcaption></figure>
</body></html>
