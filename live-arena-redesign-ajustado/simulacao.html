        });

        document.getElementById('btnViewResponsive').addEventListener('click', () => this.setViewport('auto'));
        document.getElementById('btnViewMobile').addEventListener('click', () => this.setViewport('mobile'));
        document.getElementById('btnViewTV').addEventListener('click', () => this.setViewport('tv'));
      },

      updateThemeBackground(screenId) {
        const body = document.getElementById('mainBody');
        // As telas de Ringue do Aluno (LA-03B/C/D/E) e TV Palco (LA-09/LA-11) exibem o fundo oficial com listras diagonais esportivas azuis
        const isArenaStriped = ['LA-03-mission', 'LA-03-evaluating', 'LA-03-result', 'LA-03-collective', 'LA-03-final', 'LA-09', 'LA-09-connect', 'LA-09-final', 'LA-11'].includes(screenId);
        
        if (isArenaStriped) {
          body.classList.remove('portal-bg');
          body.classList.add('arena-stripes-bg');
        } else {
          body.classList.remove('arena-stripes-bg');
          body.classList.add('portal-bg');
        }
      },

      setViewport(mode) {
        this.viewportMode = mode;
        document.body.dataset.viewportMode = mode;
        const container = document.getElementById('screenContainer');
        const btns = [
          document.getElementById('btnViewResponsive'),
          document.getElementById('btnViewMobile'),
          document.getElementById('btnViewTV')
        ];

        btns.forEach(b => {
          b.className = 'px-2.5 py-1 text-xs rounded-lg font-semibold text-slate-600 hover:text-slate-900 transition-all';
        });

        if (mode === 'mobile') {
          container.className = 'w-full max-w-[400px] mx-auto border-8 border-slate-900 rounded-[44px] overflow-hidden shadow-2xl p-2 bg-slate-100 transition-all';
          btns[1].className = 'px-2.5 py-1 text-xs rounded-lg font-bold bg-blue-100 text-blue-900 border border-blue-300 shadow-xs';
        } else if (mode === 'tv') {
          container.className = 'w-full max-w-[1340px] aspect-video mx-auto border-8 border-slate-900 rounded-3xl overflow-hidden shadow-2xl p-4 bg-slate-950 transition-all';
          btns[2].className = 'px-2.5 py-1 text-xs rounded-lg font-bold bg-indigo-100 text-indigo-900 border border-indigo-300 shadow-xs';
        } else {
          container.className = 'w-full max-w-6xl mx-auto transition-all';
          btns[0].className = 'px-2.5 py-1 text-xs rounded-lg font-bold bg-blue-100 text-blue-900 border border-blue-300 shadow-xs';
        }
      },

      showToast(message, icon = '✨') {
        const toast = document.getElementById('toastNotification');
        document.getElementById('toastText').innerText = message;
        document.getElementById('toastIcon').innerText = icon;
        toast.classList.remove('translate-y-20', 'opacity-0');
        toast.classList.add('translate-y-0', 'opacity-100');
        setTimeout(() => {
          toast.classList.add('translate-y-20', 'opacity-0');
          toast.classList.remove('translate-y-0', 'opacity-100');
        }, 3200);
      },

      openModal(htmlContent) {
        const modal = document.getElementById('globalModal');
        const content = document.getElementById('modalContent');
        content.innerHTML = `
          <button onclick="app.closeModal()" class="absolute top-5 right-5 text-slate-400 hover:text-slate-700 p-1.5 rounded-full bg-slate-100 hover:bg-slate-200 transition-colors">
            ✕
          </button>
          ${htmlContent}
        `;
        modal.classList.remove('hidden');
      },

      closeModal() {
        document.getElementById('globalModal').classList.add('hidden');
      },

      renderScreen(screenId) {
        this.currentScreen = screenId;
        this.updateThemeBackground(screenId);

        const container = document.getElementById('screenContainer');
        const selector = document.getElementById('screenSelector');
        if (selector.value !== screenId) {
          selector.value = screenId;
        }

        switch(screenId) {
          case 'LA-01': container.innerHTML = this.viewPortal(); break;
          case 'LA-02': container.innerHTML = this.viewStudentJoin(); break;
          case 'LA-03-lobby': container.innerHTML = this.viewStudentLobby(); break;
          case 'LA-03-mission': container.innerHTML = this.viewStudentMission(); break;
          case 'LA-03-evaluating': container.innerHTML = this.viewStudentEvaluating(); break;
          case 'LA-03-result': container.innerHTML = this.viewStudentResult(); break;
          case 'LA-03-collective': container.innerHTML = this.viewStudentCollective(); break;
          case 'LA-03-final': container.innerHTML = this.viewStudentFinal(); break;
          case 'LA-04': container.innerHTML = this.viewAdminLogin(); break;
          case 'LA-05': container.innerHTML = this.viewTeacherDashboard(); break;
          case 'LA-06': container.innerHTML = this.viewRoomDetail(); break;
          case 'LA-06-people': container.innerHTML = this.viewRoomParticipants(); break;
          case 'LA-06-queue': container.innerHTML = this.viewEvaluationQueue(); break;
          case 'LA-06-draw': container.innerHTML = this.viewIndependentDraw(); break;
          case 'LA-07': container.innerHTML = this.viewChallengesBank(); break;
          case 'LA-07-editor': container.innerHTML = this.viewChallengeEditor(); break;
          case 'LA-07-bulk': container.innerHTML = this.viewBulkCorrection(); break;
          case 'LA-08': container.innerHTML = this.viewLessonsTracks(); break;
          case 'LA-09': container.innerHTML = this.viewTVStage(); break;
          case 'LA-09-connect': container.innerHTML = this.viewTVConnect(); break;
          case 'LA-09-final': container.innerHTML = this.viewTVFinal(); break;
          case 'LA-10': container.innerHTML = this.viewStudentPreview(); break;
          case 'LA-11': container.innerHTML = this.viewTVPreview(); break;
          case 'LA-12': container.innerHTML = this.viewAnalyticsReport(); break;
          case 'LA-13': container.innerHTML = this.viewNotFound(); break;
          default: container.innerHTML = this.viewPortal();
        }
      },

        const sub = mockData.currentMission.lastSubmission;
        const remaining = Math.max(0, mockData.currentMission.attemptsAllowed - mockData.currentMission.attemptsUsed);
        const best = sub.criteria.reduce((a,b)=>a.score>b.score?a:b);
        const focus = sub.criteria.reduce((a,b)=>a.score<b.score?a:b);
        return `

                  <div class="relative w-32 h-32 shrink-0 mx-auto md:mx-0"><div class="absolute inset-0 rounded-full border-[10px] border-blue-100"></div><div class="absolute inset-0 rounded-full border-[10px] border-blue-600 border-l-transparent border-b-transparent -rotate-45"></div><div class="absolute inset-0 flex flex-col items-center justify-center"><span class="text-4xl font-mono font-black text-blue-700 leading-none">${sub.score}</span><span class="text-[10px] font-black text-slate-500 uppercase tracking-widest mt-1">de 100</span></div></div>

          <main class="teacher-workspace p-1">${content}</main>
        </section>
      </div>`;
    }
    app.renderScreen = function(id) {
      originalRender.call(this,id);
      const teacherArea=teacherScreenIds.has(id);
      const studentArea=id==='LA-02' || id==='LA-10' || id.startsWith('LA-03');
      document.body.classList.toggle('teacher-saas-bg', teacherArea || id==='LA-04');
      if(teacherArea) document.body.dataset.teacherApp='true';
      else delete document.body.dataset.teacherApp;
      if(studentArea) document.body.dataset.studentApp='true';
      else delete document.body.dataset.studentApp;
      const root=document.getElementById('screenContainer');
      root.dataset.screenId=id;root.dataset.route=compatibilityRoutes[id] || (id.startsWith('LA-03')?'/play':'404');
      root.querySelectorAll('button').forEach(btn=>{
        const action=btn.getAttribute('onclick')||'';
        const restricted=(id==='LA-03-lobby'&&action.includes("renderScreen('LA-03-mission')")) ||
          (id==='LA-03-evaluating'&&action.includes("renderScreen('LA-03-result')")) ||
          (id==='LA-03-result'&&action.includes("renderScreen('LA-03-collective')")) ||
          (id==='LA-03-collective'&&action.includes('renderScreen')) ||
          (id==='LA-09'&&action.includes("renderScreen('LA-06')"));
        if(restricted)btn.remove();
      });
      decorateTeacherWorkspace(id);
    };

    window.addEventListener('DOMContentLoaded', () => {
      app.init();
    });
  </script>
